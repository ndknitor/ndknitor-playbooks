---
- name: Install LVM2
  ansible.builtin.apt:
    name: lvm2
    state: present
    update_cache: yes

- name: Check if volume group already exists
  ansible.builtin.command:
    cmd: "vgs {{ cinder_volume_group }}"
  register: vg_check
  changed_when: false
  failed_when: false
  when: cinder_use_loop_device

- name: Create loop device backing directory
  ansible.builtin.file:
    path: "{{ cinder_loop_file | dirname }}"
    state: directory
    mode: '0755'
  when: cinder_use_loop_device and vg_check.rc != 0

- name: Create loop device backing file
  ansible.builtin.command:
    cmd: "truncate -s {{ cinder_loop_size_gb }}G {{ cinder_loop_file }}"
    creates: "{{ cinder_loop_file }}"
  when: cinder_use_loop_device and vg_check.rc != 0

- name: Set up loop device
  ansible.builtin.command:
    cmd: "losetup -f {{ cinder_loop_file }}"
  register: loop_setup
  changed_when: loop_setup.rc == 0
  failed_when: false
  when: cinder_use_loop_device and vg_check.rc != 0

- name: Find loop device for backing file
  ansible.builtin.shell:
    cmd: "losetup -j {{ cinder_loop_file }} | head -1 | cut -d: -f1"
  register: loop_device
  changed_when: false
  when: cinder_use_loop_device and vg_check.rc != 0

- name: Create physical volume on loop device
  ansible.builtin.command:
    cmd: "pvcreate {{ loop_device.stdout }}"
  when: cinder_use_loop_device and vg_check.rc != 0 and loop_device.stdout | length > 0

- name: Create volume group
  ansible.builtin.command:
    cmd: "vgcreate {{ cinder_volume_group }} {{ loop_device.stdout }}"
  when: cinder_use_loop_device and vg_check.rc != 0 and loop_device.stdout | length > 0

- name: Install cinder-loop systemd service
  ansible.builtin.template:
    src: cinder-loop.service.j2
    dest: /etc/systemd/system/cinder-loop.service
    mode: '0644'
  when: cinder_use_loop_device

- name: Enable cinder-loop service
  ansible.builtin.systemd:
    name: cinder-loop
    enabled: yes
    daemon_reload: yes
  when: cinder_use_loop_device
