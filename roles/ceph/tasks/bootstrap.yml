---
- name: Check if Ceph cluster already bootstrapped
  ansible.builtin.stat:
    path: /etc/ceph/ceph.conf
  register: ceph_conf

- name: Bootstrap Ceph cluster
  ansible.builtin.command:
    cmd: >
      cephadm bootstrap
      --mon-ip {{ ansible_host }}
      --cluster-network {{ ceph_cluster_network }}
      --skip-monitoring-stack
      --skip-dashboard
  when: not ceph_conf.stat.exists

- name: Wait for Ceph cluster to be ready
  ansible.builtin.command:
    cmd: ceph health
  register: ceph_health
  retries: 12
  delay: 10
  until: ceph_health.rc == 0
  changed_when: false

- name: Copy Ceph SSH public key to other MON nodes
  ansible.builtin.shell:
    cmd: >
      ssh-copy-id -f -i /etc/ceph/ceph.pub
      -o StrictHostKeyChecking=no
      root@{{ hostvars[item]['ansible_host'] }}
  loop: "{{ groups['ceph_mon'] | difference([inventory_hostname]) }}"
  when: not ceph_conf.stat.exists

- name: Add other MON hosts to Ceph cluster
  ansible.builtin.command:
    cmd: >
      ceph orch host add {{ item }}
      {{ hostvars[item]['ansible_host'] }}
      --labels _admin,mon,mgr
  loop: "{{ groups['ceph_mon'] | difference([inventory_hostname]) }}"
  when: not ceph_conf.stat.exists

- name: Add OSD-only hosts to Ceph cluster
  ansible.builtin.command:
    cmd: >
      ceph orch host add {{ item }}
      {{ hostvars[item]['ansible_host'] }}
      --labels osd
  loop: "{{ groups['ceph_osd'] | default([]) | difference(groups['ceph_mon']) }}"
  when: not ceph_conf.stat.exists

- name: Set MON placement to labeled hosts
  ansible.builtin.command:
    cmd: ceph orch apply mon --placement="label:mon"
  changed_when: false

- name: Set MGR placement to labeled hosts
  ansible.builtin.command:
    cmd: ceph orch apply mgr --placement="label:mgr"
  changed_when: false

- name: Wait for all MONs to join
  ansible.builtin.shell:
    cmd: ceph mon stat --format json | python3 -c "import sys,json; print(json.load(sys.stdin)['election_epoch'])"
  register: mon_check
  retries: 30
  delay: 10
  until: mon_check.rc == 0
  changed_when: false
