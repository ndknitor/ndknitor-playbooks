# Install CNI plugin (Calico) : kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
---
# Play 1: Bootstrap all Kubernetes nodes (containerd, kubeadm, kubelet, kernel modules, sysctl)
- name: Bootstrap Kubernetes nodes
  hosts: k8s_control_plane:k8s_worker
  become: true
  vars:
    network_interface: eth1
    vip: 192.168.56.100
    max_pods_per_node: 110
    k8s_version: "1.34"
  roles:
    - k8s_bootstrap

# Play 2: Set up Keepalived on control plane nodes for API server VIP
- name: Set up Keepalived for control plane VIP
  hosts: k8s_control_plane
  become: true
  vars:
    vip: 192.168.56.100/24
    interface: eth1
    router_id: 51
    base_priority: 100
    config_file: /etc/keepalived/keepalived.conf
    priority_step: 10
    auth_pass: password
    keepalived_group: k8s_control_plane
  roles:
    - keepalived

# Play 3: Initialize first control plane node
- name: Initialize first control plane node
  hosts: k8s_control_plane[0]
  become: true
  vars:
    network_interface: eth1
    vip: 192.168.56.100
    pod_network_cidr: 10.244.0.0/16
  tasks:
    - name: Initialize control plane
      ansible.builtin.include_role:
        name: k8s_setup
        tasks_from: init_control_plane.yml

# Play 4: Join remaining control plane nodes (one at a time)
- name: Join additional control plane nodes
  hosts: k8s_control_plane[1:]
  become: true
  serial: 1
  vars:
    network_interface: eth1
  tasks:
    - name: Join control plane
      ansible.builtin.include_role:
        name: k8s_setup
        tasks_from: join_control_plane.yml

# Play 5: Join worker nodes
- name: Join worker nodes
  hosts: k8s_worker
  become: true
  tasks:
    - name: Join worker
      ansible.builtin.include_role:
        name: k8s_setup
        tasks_from: join_worker.yml
