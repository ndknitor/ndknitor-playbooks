---
# Play 1: Ensure Docker on all OpenStack nodes
- name: Install Docker on OpenStack nodes
  hosts: openstack_controller:openstack_compute
  become: true
  roles:
    - docker

# Play 2: Prepare all OpenStack nodes
- name: Prepare OpenStack nodes
  hosts: openstack_controller:openstack_compute
  become: true
  roles:
    - kolla_prepare

# Play 3: Prepare Cinder LVM storage
- name: Prepare Cinder LVM storage
  hosts: openstack_storage
  become: true
  tasks:
    - name: Set up Cinder storage
      ansible.builtin.include_role:
        name: kolla_prepare
        tasks_from: storage.yml

# Play 4: Export Ceph config and keyrings for Kolla-Ansible
- name: Integrate Ceph with Kolla-Ansible
  hosts: openstack_controller[0]
  become: true
  tasks:
    - name: Export Ceph config for Kolla
      ansible.builtin.include_role:
        name: ceph
        tasks_from: integrate.yml
      when: kolla_enable_ceph | default(false)

# Play 5: Install and configure Kolla-Ansible on deploy node
- name: Install and configure Kolla-Ansible
  hosts: openstack_controller[0]
  become: true
  roles:
    - kolla_deploy
